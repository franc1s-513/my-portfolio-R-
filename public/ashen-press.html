<!doctype html>
<meta charset="utf-8">
<title>Ashen Press — The Art Book Shelf</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#c6ae8e;
    --ink:#241a12;
    --ink-soft:rgba(36,26,18,.6);
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block;
    touch-action:none;user-select:none;-webkit-user-select:none;
    touch-action:none;user-select:none;-webkit-user-select:none;
    opacity:0;transition:opacity 1s linear}
  canvas#gl.on{opacity:1}

  /* ---------- title: WHAT I'VE BUILT ---------- */
  .shelf-title {
    position: fixed;
    top: 22px;
    left: 0;
    right: 0;
    z-index: 12;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: none;
    text-align: center;
    transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
  }
  body.reading .shelf-title {
    opacity: 0;
    transform: translateY(-14px);
  }
  .shelf-title h1 {
    font-family: "EB Garamond", Georgia, serif;
    font-size: clamp(26px, 3.2vw, 38px);
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #241a12;
    margin: 0;
    padding: 0;
  }
  .shelf-title h1 .accent {
    color: #92400e;
    font-style: italic;
    font-weight: 500;
  }

  /* ---------- footer: GitHub on left, Certificates on right ---------- */
  footer.shelf-footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 15;
    padding: 18px 0 22px;
    background: linear-gradient(to top, rgba(198,174,142,0.92) 40%, rgba(198,174,142,0.5) 75%, rgba(198,174,142,0));
    pointer-events: none;
    transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
  }
  body.reading footer.shelf-footer {
    opacity: 0;
    transform: translateY(16px);
  }
  .footer-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 clamp(24px, 4.5vw, 64px);
    width: 100%;
    box-sizing: border-box;
  }
  .footer-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    pointer-events: auto;
    font-family: Inter, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 500;
    padding: 12px 24px;
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    transition: transform .22s var(--ease), box-shadow .22s var(--ease), background .22s, border-color .22s;
    box-shadow: 0 2px 8px rgba(36,26,18,0.18), 0 6px 16px -4px rgba(36,26,18,0.22);
  }
  .footer-github {
    background: #1c1917;
    color: #fdf8ef;
    border: 1px solid #1c1917;
  }
  .footer-github:hover {
    background: #2d2621;
    border-color: #2d2621;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(36,26,18,0.25), 0 10px 22px -4px rgba(36,26,18,0.28);
  }
  .footer-cert {
    background: #fdf8ef;
    color: var(--ink);
    border: 1px solid rgba(36,26,18,0.24);
  }
  .footer-cert:hover {
    background: #ffffff;
    border-color: rgba(36,26,18,0.4);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(52,34,16,0.18), 0 10px 20px -4px rgba(52,34,16,0.22);
  }

  /* ---------- the opening: every element on its own beat ---------- */
  .rise{opacity:0;transform:translateY(13px);
    transition:opacity .74s var(--ease) var(--d,0ms),transform .74s var(--ease) var(--d,0ms)}
  .rise.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .rise{transform:none;transition:opacity .3s linear var(--d,0ms)}
  }

  /* ---------- focused volume panel ---------- */
  .wash{position:fixed;left:0;top:0;z-index:14;height:100vh;
    width:min(664px,62vw);pointer-events:none;display:block}
  body.mobile .wash{display:none}
  .detail{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:15;
    width:min(560px,50vw);padding:92px 120px 92px 54px;opacity:0;pointer-events:none;
    transition:opacity .45s var(--ease) .14s}
  .detail .meta,.detail h2,.detail p,.detail .acts{max-width:326px}
  .detail.on{opacity:1}
  .detail .acts button{pointer-events:auto}
  .detail .meta{font-size:13px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--ink-soft);margin:0 0 13px}
  .detail h2{font-family:"EB Garamond",Georgia,serif;font-weight:500;
    font-size:46px;line-height:1.06;margin:0 0 18px;letter-spacing:-.005em}
  .detail p{font:400 17px/1.62 Inter,sans-serif;margin:0 0 32px;color:rgba(36,26,18,.84)}
  .detail .acts{display:flex;gap:10px}
  .detail .acts button{
    font:500 14.5px/1 Inter,sans-serif;color:var(--ink);background:#fdf8ef;border:0;
    border-radius:999px;padding:15px 24px;cursor:pointer;
    transition:transform .22s var(--ease),box-shadow .22s var(--ease),background .22s;
    box-shadow:0 1px 1px rgba(52,34,16,.18),
               0 3px 6px rgba(52,34,16,.14),
               0 10px 20px -6px rgba(52,34,16,.26),
               0 26px 44px -18px rgba(52,34,16,.34),
               inset 0 1px 0 rgba(255,255,255,.85)}
  .detail .acts button:hover{background:#fffcf5;transform:translateY(-2px);
    box-shadow:0 1px 1px rgba(52,34,16,.18),
               0 5px 10px rgba(52,34,16,.16),
               0 16px 28px -8px rgba(52,34,16,.28),
               0 36px 60px -22px rgba(52,34,16,.38),
               inset 0 1px 0 rgba(255,255,255,.9)}
  .detail .acts button:active{transform:translateY(0);
    box-shadow:0 1px 2px rgba(52,34,16,.22),0 4px 10px -2px rgba(52,34,16,.24),
               inset 0 1px 0 rgba(255,255,255,.7)}

  .hint{position:fixed;z-index:16;left:0;top:0;transform:translate(10px,10px);
    background:#fdf8ef;color:var(--ink);border-radius:999px;padding:8px 13px;
    font:500 13.5px/1 Inter,sans-serif;box-shadow:0 2px 14px rgba(50,35,20,.2);
    pointer-events:none;opacity:0;transition:opacity .5s}
  .hint.on{opacity:1}

  /* ---------- catalogue rail ---------- */
  footer{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:30px 0 22px;
    background:linear-gradient(to top,rgba(198,174,142,.94) 46%,rgba(198,174,142,.62) 76%,rgba(198,174,142,0));
    border-top:1px solid rgba(36,26,18,.16);opacity:0;transition:opacity .7s var(--ease) .34s}
  footer.on{opacity:1}
  body.reading footer{opacity:.3}
  .tl{display:flex;justify-content:space-between;align-items:center;
    gap:clamp(9px,1.2vw,22px);padding:0 clamp(14px,2.5vw,44px);
    overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
    mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%);
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 26px,#000 calc(100% - 26px),transparent 100%)}
  .tl::-webkit-scrollbar{display:none}
  .tl>*{flex:0 1 auto;min-width:0}
  .tli{background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;
    flex:0 0 auto;display:flex;align-items:center;gap:11px}
  .tlmark{flex:0 0 auto;width:36px;height:36px;object-fit:contain;opacity:.5;
    transition:opacity .4s var(--ease),transform .4s var(--ease)}
  .tli:hover .tlmark{opacity:.95;transform:translateY(-1px) scale(1.06)}
  .tltxt{display:block;min-width:0;white-space:nowrap}
  .tli p{margin:0;font-size:12.5px;line-height:1.24;color:var(--ink-soft);transition:color .45s}
  .tli p.studio{margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tli h2{margin:0;font-size:14px;font-weight:400;line-height:1.22;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .tli:hover p{color:var(--ink)}

  /* ---------- mobile: the stack you flick through ---------- */
  .mbar{position:fixed;left:0;right:0;bottom:0;z-index:18;display:none;
    align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 22px;
    opacity:0;transition:opacity .6s var(--ease)}
  .mbar.on{opacity:1}
  .mbar-txt p{margin:0 0 4px;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .mbar-txt h2{margin:0;font-family:"EB Garamond",Georgia,serif;font-size:24px;font-weight:500;line-height:1.12}
  .mbar-acts{display:flex;gap:8px;flex:0 0 auto}
  .mbar-acts button{font:500 14.5px/1 Inter,sans-serif;border:0;border-radius:999px;
    padding:15px 21px;
    box-shadow:0 1px 1px rgba(52,34,16,.18),0 4px 9px rgba(52,34,16,.16),
               0 14px 26px -8px rgba(52,34,16,.30),inset 0 1px 0 rgba(255,255,255,.6);cursor:pointer;background:rgba(253,247,236,.9);color:var(--ink)}
  .mbar-acts button.solid{background:var(--ink);color:#f2ece1}
  .menubtn{position:fixed;right:14px;top:10px;z-index:22;width:34px;height:34px;border:0;
    background:none;display:none;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}
  .menubtn span{display:block;height:1.8px;background:var(--ink);border-radius:2px}
  .menu{position:fixed;inset:0;z-index:21;background:rgba(206,186,157,.97);backdrop-filter:blur(14px);
    padding:66px 20px 24px;display:flex;flex-direction:column;overflow:auto}
  .menu[hidden]{display:none}
  .menu button{background:none;border:0;text-align:left;padding:13px 4px;cursor:pointer;
    border-bottom:1px solid rgba(36,26,18,.14);color:var(--ink);
    font-family:"EB Garamond",Georgia,serif;font-size:21px}
  .menu button span{display:block;margin-bottom:4px;font-family:Inter,sans-serif;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}

  body.mobile footer{display:none}
  body.mobile .mbar{display:flex;padding-top:52px;
    background:linear-gradient(to top,rgba(198,174,142,.97) 34%,rgba(198,174,142,.72) 68%,rgba(198,174,142,0))}
  body.mobile .menubtn{display:flex}
  body.mobile header{padding:0 14px;gap:10px}
  body.mobile header .right{margin-right:42px}
  body.mobile .detail{display:none}
  .mbar{background:linear-gradient(to top, rgba(203,182,152,.96), rgba(203,182,152,0))}

  /* ---------- loader ---------- */
  .loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;
    background:var(--bg);transition:opacity .6s linear;pointer-events:none}
  .loader.gone{opacity:0}
  .bar{width:92px;height:2px;background:rgba(29,24,21,.2);position:relative;overflow:hidden}
  .bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--ink);
    transition:transform .3s linear}

  .tlmark { width: 36px !important; height: 36px !important; object-fit: cover !important; border-radius: 5px !important; opacity: .82 !important; box-shadow: 0 2px 5px rgba(0,0,0,0.2) !important; border: 1px solid rgba(255,255,255,0.2) !important; }
  /* Clean Left Panel: Heading + 3-4 line About + GitHub & Live Link */
  .detail {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 15;
    width: min(560px, 48vw);
    padding: 0 40px 0 60px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .45s var(--ease) .14s;
  }
  .detail.on {
    opacity: 1;
    pointer-events: auto;
  }
  .detail h2 {
    font-family: "EB Garamond", Georgia, serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1.12;
    margin: 0 0 16px;
    color: var(--ink);
    letter-spacing: -0.012em;
    max-width: 380px;
  }
  .detail p.detail-about {
    font-family: Inter, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.62;
    margin: 0 0 28px;
    color: rgba(36, 26, 18, 0.88);
    max-width: 375px;
  }
  .detail .acts {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    max-width: 400px;
  }
  .detail .acts a.act-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    text-decoration: none;
    font-family: Inter, -apple-system, sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: 999px;
    padding: 13px 22px;
    cursor: pointer;
    transition: transform .22s var(--ease), box-shadow .22s var(--ease), background .22s, border-color .22s;
  }
  .detail .acts a.act-github {
    background: #1c1917;
    color: #fdf8ef;
    border: 1px solid #1c1917;
    box-shadow: 0 2px 8px rgba(28,25,23,0.22), 0 8px 18px -4px rgba(28,25,23,0.26);
  }
  .detail .acts a.act-github:hover {
    background: #2c2724;
    border-color: #2c2724;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(28,25,23,0.3), 0 12px 24px -4px rgba(28,25,23,0.32);
  }
  .detail .acts a.act-live {
    background: #fdf8ef;
    color: var(--ink);
    border: 1px solid rgba(36,26,18,0.24);
    box-shadow: 0 2px 6px rgba(52,34,16,0.12), 0 6px 14px -4px rgba(52,34,16,0.16);
  }
  .detail .acts a.act-live:hover {
    background: #ffffff;
    border-color: rgba(36,26,18,0.4);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(52,34,16,0.18), 0 10px 20px -4px rgba(52,34,16,0.22);
  }
</style>

</footer>

  <div class="mbar-txt"><p id="mbar-meta"></p><h2 id="mbar-title"></h2></div>

const TAU = Math.PI*2;
const SANS  = 'Inter,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';
const SERIF = '"EB Garamond",Didot,"Bodoni 72",Georgia,"Times New Roman",serif';
const MONO  = 'ui-monospace,"SF Mono",Menlo,Monaco,Consolas,monospace';

const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const smooth= t=>t<=0?0:t>=1?1:t*t*(3-2*t);
function mulberry(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function C(w,h){const c=document.createElement('canvas');c.width=w;c.height=h===undefined?w:h;return c;}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function lg(g,x0,y0,x1,y1,stops){const t=g.createLinearGradient(x0,y0,x1,y1);for(const s of stops)t.addColorStop(s[0],s[1]);return t;}
function rg(g,x,y,r0,r1,stops,x1,y1){const t=g.createRadialGradient(x,y,r0,x1===undefined?x:x1,y1===undefined?y:y1,r1);for(const s of stops)t.addColorStop(s[0],s[1]);return t;}
function tracked(g,text,x,y,track,align){
  let w=0;for(const ch of text)w+=g.measureText(ch).width+track;w-=track;
  let cx = align==='center'? x-w/2 : align==='right'? x-w : x;
  const prev=g.textAlign;g.textAlign='left';
  for(const ch of text){g.fillText(ch,cx,y);cx+=g.measureText(ch).width+track;}
  g.textAlign=prev;return w;
}
function fitTracked(g,text,w,weight,family,track){
  let lo=4,hi=3000;
  const meas=px=>{g.font=`${weight} ${px}px ${family}`;let t=0;for(const ch of text)t+=g.measureText(ch).width+track*px;return t-track*px;};
  for(let i=0;i<26;i++){const m=(lo+hi)/2;if(meas(m)>w)hi=m;else lo=m;}
  g.font=`${weight} ${lo}px ${family}`;return lo;
}
function grain(g,W,H,amount,seed){
  const r=mulberry(seed||7);const img=g.getImageData(0,0,W,H),d=img.data;
  for(let i=0;i<d.length;i+=4){const n=(r()-0.5)*amount;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  g.putImageData(img,0,0);
}
function cloth(g,W,H,seed,amt){
  const r=mulberry(seed||3);
  g.save();g.globalAlpha=amt===undefined?.05:amt;
  for(let y=0;y<H;y+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(0,y,W,1);}
  for(let x=0;x<W;x+=3){g.fillStyle=r()>.5?'#fff':'#000';g.fillRect(x,0,1,H);}
  g.restore();
}
function rule(g,x0,y0,x1,y1,col,w){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}

/* Bespoke Vector Emblems for all 10 volumes (100% Unique, Zero Stock Images) */
function drawEmblem(g, id, W, H) {
  const cx = W * 0.5, cy = H * 0.58;
  const R = W * 0.23;

  g.save();
  g.lineCap = 'round';
  g.lineJoin = 'round';

  if (id === 'krishi-sakhi') {
    // 1. Krishi Sakhi: Glowing Emerald Crop / Tree Lattice
    const stemTop = cy - R * 0.85, stemBot = cy + R * 0.85;
    
    // Background glow
    g.strokeStyle = 'rgba(74, 222, 128, 0.25)';
    g.lineWidth = W * 0.024;
    g.beginPath(); g.moveTo(cx, stemTop); g.lineTo(cx, stemBot); g.stroke();

    // Sharp central stem
    g.strokeStyle = '#4ade80';
    g.lineWidth = W * 0.007;
    g.beginPath(); g.moveTo(cx, stemTop); g.lineTo(cx, stemBot); g.stroke();

    // Horizontal leafy branches
    const tiers = 7;
    for (let i = 0; i < tiers; i++) {
      const ty = stemTop + (i + 0.8) / (tiers + 0.6) * (stemBot - stemTop);
      const span = R * (0.45 + 0.45 * Math.sin((i + 1) / (tiers + 1) * Math.PI));
      
      // Branch glow
      g.strokeStyle = 'rgba(74, 222, 128, 0.2)';
      g.lineWidth = W * 0.016;
      g.beginPath(); g.moveTo(cx - span, ty); g.lineTo(cx + span, ty); g.stroke();

      // Sharp branch line
      g.strokeStyle = '#86efac';
      g.lineWidth = W * 0.005;
      g.beginPath(); g.moveTo(cx - span, ty); g.lineTo(cx + span, ty); g.stroke();

      // End leaf nodes
      g.fillStyle = '#bbf7d0';
      g.beginPath(); g.arc(cx - span, ty, W * 0.008, 0, TAU); g.fill();
      g.beginPath(); g.arc(cx + span, ty, W * 0.008, 0, TAU); g.fill();
    }
  } else if (id === 'placemate') {
    // 2. Placemate Tracker: Glowing Neon Blue Radar Hexagon
    const sides = 6;
    for (let k = 1; k <= 3; k++) {
      const rk = R * (k / 3.0);
      g.strokeStyle = 'rgba(96, 165, 250, 0.28)';
      g.lineWidth = W * 0.003;
      g.beginPath();
      for (let s = 0; s < sides; s++) {
        const ang = s / sides * TAU - Math.PI / 2;
        const x = cx + Math.cos(ang) * rk, y = cy + Math.sin(ang) * rk;
        s === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
      }
      g.closePath();
      g.stroke();
    }
    for (let s = 0; s < sides; s++) {
      const ang = s / sides * TAU - Math.PI / 2;
      g.strokeStyle = 'rgba(96, 165, 250, 0.25)';
      g.lineWidth = W * 0.0025;
      g.beginPath();
      g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(ang) * R, cy + Math.sin(ang) * R);
      g.stroke();
    }
    const profile = [0.90, 0.72, 0.85, 0.65, 0.80, 0.95];
    g.fillStyle = 'rgba(59, 130, 246, 0.22)';
    g.beginPath();
    for (let s = 0; s < sides; s++) {
      const ang = s / sides * TAU - Math.PI / 2;
      const r = R * profile[s];
      const x = cx + Math.cos(ang) * r, y = cy + Math.sin(ang) * r;
      s === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
    }
    g.closePath();
    g.fill();
    g.strokeStyle = '#60a5fa';
    g.lineWidth = W * 0.006;
    g.stroke();
  } else if (id === 'detective-ai') {
    // 3. Detective AI: Forensic Face Biometrics Scanner
    g.strokeStyle = 'rgba(244, 114, 182, 0.3)';
    g.lineWidth = W * 0.003;
    g.strokeRect(cx - R * 0.9, cy - R * 0.9, R * 1.8, R * 1.8);

    const cornerLen = R * 0.28;
    g.strokeStyle = '#f472b6';
    g.lineWidth = W * 0.007;
    // Top-left
    g.beginPath(); g.moveTo(cx - R * 0.9, cy - R * 0.9 + cornerLen); g.lineTo(cx - R * 0.9, cy - R * 0.9); g.lineTo(cx - R * 0.9 + cornerLen, cy - R * 0.9); g.stroke();
    // Top-right
    g.beginPath(); g.moveTo(cx + R * 0.9 - cornerLen, cy - R * 0.9); g.lineTo(cx + R * 0.9, cy - R * 0.9); g.lineTo(cx + R * 0.9, cy - R * 0.9 + cornerLen); g.stroke();
    // Bottom-left
    g.beginPath(); g.moveTo(cx - R * 0.9, cy + R * 0.9 - cornerLen); g.lineTo(cx - R * 0.9, cy + R * 0.9); g.lineTo(cx - R * 0.9 + cornerLen, cy + R * 0.9); g.stroke();
    // Bottom-right
    g.beginPath(); g.moveTo(cx + R * 0.9 - cornerLen, cy + R * 0.9); g.lineTo(cx + R * 0.9, cy + R * 0.9); g.lineTo(cx + R * 0.9, cy + R * 0.9 - cornerLen); g.stroke();

    // Geometric facial landmark wireframe
    const fNodes = [
      [cx - R * 0.45, cy - R * 0.35], [cx + R * 0.45, cy - R * 0.35], // Eyes
      [cx, cy - R * 0.15],                                            // Nose bridge
      [cx - R * 0.20, cy + R * 0.15], [cx + R * 0.20, cy + R * 0.15], // Nostrils
      [cx, cy + R * 0.45],                                            // Mouth
      [cx - R * 0.60, cy + R * 0.10], [cx + R * 0.60, cy + R * 0.10], // Cheekbones
      [cx, cy + R * 0.78]                                             // Chin
    ];
    g.strokeStyle = 'rgba(251, 113, 133, 0.45)';
    g.lineWidth = W * 0.003;
    const fEdges = [[0,1],[0,2],[1,2],[2,3],[2,4],[3,4],[3,5],[4,5],[0,6],[6,3],[1,7],[7,4],[6,8],[7,8],[5,8]];
    for (const [a, b] of fEdges) {
      g.beginPath(); g.moveTo(fNodes[a][0], fNodes[a][1]); g.lineTo(fNodes[b][0], fNodes[b][1]); g.stroke();
    }
    for (const [x, y] of fNodes) {
      g.fillStyle = '#fda4af';
      g.beginPath(); g.arc(x, y, W * 0.007, 0, TAU); g.fill();
    }
    g.strokeStyle = 'rgba(251, 113, 133, 0.4)';
    g.lineWidth = W * 0.002;
    for (let l = -3; l <= 3; l++) {
      const dotY = cy + l * (R * 0.24);
      const dx = cx - R * 0.82;
      g.fillStyle = '#fda4af';
      g.beginPath(); g.arc(dx, dotY, W * 0.005, 0, TAU); g.fill();
    }
  } else if (id === 'cloud-sentinel') {
    // 4. Cloud Sentinel: Glowing Warm Amber Security Shield
    const sTop = cy - R * 0.80, sMid = cy, sBot = cy + R * 0.85;
    const sw = R * 0.72;

    g.beginPath();
    g.moveTo(cx, sTop);
    g.quadraticCurveTo(cx + sw, sTop, cx + sw, sMid);
    g.quadraticCurveTo(cx + sw * 0.9, sMid + R * 0.5, cx, sBot);
    g.quadraticCurveTo(cx - sw * 0.9, sMid + R * 0.5, cx - sw, sMid);
    g.quadraticCurveTo(cx - sw, sTop, cx, sTop);
    g.closePath();

    g.fillStyle = 'rgba(251, 146, 60, 0.15)';
    g.fill();
    g.strokeStyle = '#fb923c';
    g.lineWidth = W * 0.007;

    g.strokeStyle = 'rgba(254, 215, 170, 0.8)';

    cNodes.forEach(([x, y], i) => i === 0 ? g.moveTo(x, y) : g.lineTo(x, y));

    g.moveTo(cx, cy - R * 0.35); g.lineTo(cx, cy + R * 0.35);
    g.moveTo(cx - R * 0.30, cy); g.lineTo(cx + R * 0.30, cy);

    for (const [x, y] of cNodes) {
      g.fillStyle = '#ffedd5';
      g.beginPath(); g.arc(x, y, W * 0.010, 0, TAU); g.fill();

  } else if (id === 'neurochat') {

    const numSpikes = 8;
    for (let i = 0; i < numSpikes; i++) {

      const ex = cx + Math.cos(ang) * len, ey = cy + Math.sin(ang) * len;

      g.strokeStyle = 'rgba(192, 132, 252, 0.35)';

      g.beginPath(); g.moveTo(cx, cy); g.lineTo(ex, ey); g.stroke();

      g.strokeStyle = '#c084fc';

    }
    g.strokeStyle = 'rgba(192, 132, 252, 0.4)';
    g.lineWidth = W * 0.003;
    g.beginPath();
    g.ellipse(cx, cy, R * 0.95, R * 0.38, Math.PI / 6, 0, TAU);

    const coreGrad = rg(g, cx, cy, 0, R * 0.28, [

      [1, 'rgba(168, 85, 247, 0)']

    g.fillStyle = coreGrad;
    g.beginPath(); g.arc(cx, cy, R * 0.28, 0, TAU); g.fill();
  } else if (id === 'ecosync') {
    // 6. EcoSync Smart Grid: Cyan / Teal Sine Telemetry & Coordinate Grid
    const gw = R * 0.95, gh = R * 0.65;
    const gTop = cy - gh * 0.5, gBot = cy + gh * 0.9;
    
    g.strokeStyle = 'rgba(45, 212, 191, 0.22)';

    g.strokeStyle = 'rgba(56, 189, 248, 0.35)';
    g.lineWidth = W * 0.003;
    for (let l = 0; l < layers.length - 1; l++) {
      const l1 = layers[l], l2 = layers[l + 1];
      for (let i = 0; i < l1.count; i++) {
        const x1 = cx - l1.w / 2 + (i / (l1.count - 1)) * l1.w;
        for (let j = 0; j < l2.count; j++) {
          const x2 = cx - l2.w / 2 + (j / (l2.count - 1)) * l2.w;

      g.lineWidth = W * 0.0025;
      g.beginPath();

        g.fillStyle = '#a7f3d0';
        g.beginPath(); g.arc(px, py, W * 0.006, 0, TAU); g.fill();
      }
    }
    g.strokeStyle = 'rgba(52, 211, 153, 0.5)';
    g.lineWidth = W * 0.003;
    g.beginPath();
    g.ellipse(cx, cy, R * 0.32, R * 0.85, 0, 0, TAU);
    g.stroke();
  } else if (id === 'algo-codex' || id === 'algorithmic-codex') {
    // 9. Algorithmic Codex: Golden Fibonacci Logarithmic Spiral
    g.strokeStyle = 'rgba(250, 204, 21, 0.28)';
    g.lineWidth = W * 0.015;
    g.beginPath();
    const maxTheta = 3.8 * Math.PI;

      th === 0 ? g.moveTo(x, y) : g.lineTo(x, y);

    g.strokeStyle = '#facc15';
    g.lineWidth = W * 0.0055;
    g.beginPath();
    for (let th = 0; th <= maxTheta; th += 0.08) {
      const r = a * Math.exp(bVal * th);
      const x = cx + Math.cos(th) * r, y = cy + Math.sin(th) * r;

    g.closePath();
    g.moveTo(c0[0], c0[1]); g.lineTo(top[0], top[1]);
    g.moveTo(c0[0], c0[1]); g.lineTo(lBot[0], lBot[1]);
    g.moveTo(c0[0], c0[1]); g.lineTo(rBot[0], rBot[1]);

    g.lineWidth = W * 0.006;
    g.beginPath();
    g.moveTo(cx - R * 1.15, cy - R * 0.75);
    g.lineTo(c0[0], c0[1]);

    const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7'];

      g.stroke();
    }
  }

  g.restore();
}

  g.globalAlpha = 0.80;

  g.font = `500 ${W * 0.021}px ${SANS}`;

  grain(g, W, H, 5, b.id.length * 37 + 5);
  return c;
}

function woodTexture(px){
  const W=px, Hh=Math.round(px*0.5);
  const c=C(W,Hh), g=c.getContext('2d'), r=mulberry(882);
  // Smooth warm honey-caramel architectural oak base
  const bgGrad = lg(g, 0, 0, 0, Hh, [
    [0.0, '#8d633c'],
    [0.5, '#996d44'],
    [1.0, '#865c36']
  ]);
  g.fillStyle = bgGrad;
  g.fillRect(0, 0, W, Hh);
  
  // Soft organic tone shifts
  for(let i=0; i<18; i++){
    g.fillStyle = `rgba(${165+r()*30|0},${120+r()*25|0},${70+r()*20|0},${0.04+r()*0.06})`;
    g.beginPath();
    g.ellipse(r()*W, r()*Hh, W*(0.15+r()*0.35), Hh*(0.08+r()*0.20), 0, 0, TAU);
    g.fill();
  }
  
  // Fine, low-contrast wandering wood grain fibers (smooth satin architectural finish)
  for(let i=0; i<260; i++){
    const y0 = r()*Hh, amp = Hh*(0.003 + r()*0.010), f = 0.8 + r()*1.8, ph = r()*TAU;
    const dark = r() < 0.4;
    g.strokeStyle = dark
      ? `rgba(70, 44, 22, ${0.08 + r()*0.14})`
      : `rgba(180, 138, 90, ${0.06 + r()*0.12})`;
    g.lineWidth = 0.6 + r()*1.2;
    g.beginPath();
    for(let x=0; x<=W; x+=12){
      const y = y0 + Math.sin(x/W*TAU*f + ph)*amp + Math.sin(x/W*TAU*f*2.2 + ph*1.5)*amp*0.35;
      x ? g.lineTo(x, y) : g.moveTo(x, y);
    }
    g.stroke();
  }
  
  // Gentle fine satin pores
  for(let i=0; i<1600; i++){
    g.fillStyle = `rgba(50, 30, 14, ${0.04 + r()*0.08})`;
    g.fillRect(r()*W, r()*Hh, 1 + r()*3, 1);
  }
  
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 16;
  return t;
}

        L *= 1-0.30*s*band;

      d[o]  =clamp((L+n)*WT.tint[0],0,255);
      d[o+1]=clamp((L+n)*WT.tint[1],0,255);
      d[o+2]=clamp((L+n)*WT.tint[2],0,255);

  t.minFilter=THREE.LinearMipmapLinearFilter;t.magFilter=THREE.LinearFilter;
  return t;
}

  return new THREE.ShaderMaterial({
    transparent:true,
    uniforms:{uWood:{value:WOOD_TEX},uOpacity:{value:0},uAxis:{value:axis||0}},
    vertexShader:`
      varying vec3 vP; varying vec3 vN;

        gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader:`
      uniform sampler2D uWood; uniform float uOpacity; uniform float uAxis;
      varying vec3 vP; varying vec3 vN;

        vec3 n=normalize(vN), an=abs(n);

        if(uAxis<0.5){                       // grain runs along X (shelves)
          uvH=vec2(vP.x*0.140, vP.z*0.30);
          uvV=vec2(vP.x*0.140, vP.y*0.44);
          uvE=vec2(vP.z*0.30,  vP.y*0.44);

          uvE=vec2(vP.z*0.30,  vP.x*0.55);

        vec3 wood=texture2D(uWood,uv).rgb;
        float up=max(n.y,0.0), dn=max(-n.y,0.0), fwd=max(n.z,0.0), side=abs(n.x);
        float t = 1.22*up + 0.14*dn + 0.86*fwd + 0.48*side;

function createNameplate(text, yCenter, zCenter) {
  const W = 512, H = 64;
  const c = C(W, H), g = c.getContext('2d');
  
  // Brushed brass gradient
  const bg = lg(g, 0, 0, 0, H, [
    [0.0, '#e5c07b'],
    [0.2, '#f3d99f'],
    [0.5, '#d4a359'],
    [0.8, '#b8863b'],
    [1.0, '#8c6227']

  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  // Brushed micro-streaks
  const r = mulberry(319);
  for (let i = 0; i < 400; i++) {
    g.strokeStyle = `rgba(255,255,255,${0.04 + r() * 0.08})`;
    g.lineWidth = 1;
    const y = r() * H;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();

  g.strokeStyle = 'rgba(255,255,255,0.6)';
  g.lineWidth = 1.5;
  g.strokeRect(4, 4, W - 8, H - 8);

  // Screws on left and right
  const screwR = 4;
  [16, W - 16].forEach(sx => {
    g.fillStyle = '#4a3311';
    g.beginPath(); g.arc(sx, H / 2, screwR, 0, TAU); g.fill();
    g.strokeStyle = '#f5e2b8';
    g.lineWidth = 1;
    g.beginPath(); g.arc(sx, H / 2, screwR, 0, TAU); g.stroke();
    g.beginPath(); g.moveTo(sx - screwR + 1, H / 2); g.lineTo(sx + screwR - 1, H / 2); g.stroke();
  });

  // Engraved text
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = `600 20px ${SANS}`;
  // Shadow for engraved effect
  g.fillStyle = 'rgba(255,255,255,0.4)';
  tracked(g, text, W / 2, H / 2 + 1, 3.5, 'center');
  g.fillStyle = '#2b1c09';
  tracked(g, text, W / 2, H / 2, 3.5, 'center');

  const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });

  const zPos = zCenter !== undefined ? zCenter : (K.wallZ + K.plankDepth + 0.006);
  mesh.position.set(0, yCenter, zPos);
  return mesh;
}

/* ---- cover surface: printed board under a satin varnish ---- */
const BOARD_FN = `
  // height field of a bound board: a shallow bulge that falls into a crisp chamfer
  float board(vec2 t){
    vec2 c=t*2.0-1.0;
    float bulge=(1.0-c.x*c.x)*(1.0-0.55*c.y*c.y);
    float e=clamp(min(min(t.x,1.0-t.x),min(t.y,1.0-t.y))/uER,0.0,1.0);
    float roll=sqrt(max(1.0-(1.0-e)*(1.0-e),0.0));   // quarter round, sharp at the lip
    return uBow*bulge*roll-uChamf*(1.0-roll);
  }`;
const COVER_VS = `
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  void main(){
    vUv=uv;
    vec3 pos=position; pos.z+=board(uv);
    mat3 M=mat3(modelMatrix);
    vT=normalize(M*vec3(1.0,0.0,0.0));
    vB2=normalize(M*vec3(0.0,1.0,0.0));
    vNf=normalize(M*vec3(0.0,0.0,1.0));
    vec4 wp=modelMatrix*vec4(pos,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const COVER_FS = `
  uniform sampler2D uTex; uniform float uSatin; uniform float uOpacity; uniform float uSeed;
  uniform float uBow, uChamf, uER, uW, uH;
  varying vec2 vUv; varying vec3 vT, vB2, vNf; varying vec3 vWV;
  ${BOARD_FN}
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec2 uv=clamp(vUv,0.0008,0.9992);
    vec4 tex=texture2D(uTex,uv);

    // the board normal is evaluated per pixel, so the chamfer stays crisp
    // however coarse the mesh is
    float d=0.0016;
    float hx=(board(uv+vec2(d,0.0))-board(uv-vec2(d,0.0)))/(2.0*d*uW);
    float hy=(board(uv+vec2(0.0,d))-board(uv-vec2(0.0,d)))/(2.0*d*uH);

    // linen tooth, as a small extra slope
    vec2 q=uv*vec2(58.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec2 g2=uv*9.0+uSeed;
    float n1=vnoise(g2), e=0.02;
    vec2 grain=vec2(vnoise(g2+vec2(e,0.0))-n1, vnoise(g2+vec2(0.0,e))-n1)/e;

    vec3 N=normalize(vNf
      - vT*(hx + (grain.x*0.0022+(tooth-0.5)*0.009)*uSatin)
      - vB2*(hy + (grain.y*0.0022+(tooth-0.5)*0.009)*uSatin));
    vec3 V=normalize(vWV);

    // one key from above and to the right, a broad fill bounced off the paper wall
    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float key=max(dot(N,L),0.0);
    float fill=max(dot(N,F),0.0);
    float shade=0.70+0.34*key+0.14*fill;
    vec3 col=tex.rgb*shade;

    // a tight specular that only fires on the chamfer, plus a broad satin lobe
    vec3 Hv=normalize(L+V);
    float nh=max(dot(N,Hv),0.0);
    col+=vec3(pow(nh,110.0)*0.85*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    float fres=pow(1.0-max(dot(N,V),0.0),3.4);
    col+=vec3(fres*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
    #include <colorspace_fragment>
  }`;
const SPINE_VS = `
  uniform float uHD;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  void main(){
    vUv=uv;
    mat3 M=mat3(modelMatrix);
    vNw=normalize(M*normal);
    vTw=normalize(M*vec3(0.0,0.0,1.0));   // across the back
    vBw=normalize(M*vec3(0.0,1.0,0.0));   // head to tail
    vZ=position.z/uHD;
    vec4 wp=modelMatrix*vec4(position,1.0);
    vWV=cameraPosition-wp.xyz;
    gl_Position=projectionMatrix*viewMatrix*wp; }`;
const SPINE_FS = `
  uniform sampler2D uTex; uniform float uOpacity; uniform float uSeed; uniform float uSatin;
  varying vec2 vUv; varying vec3 vNw, vTw, vBw, vWV; varying float vZ;
  float hash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
    p3+=dot(p3,p3.yxz+33.33); return fract((p3.x+p3.y)*p3.z); }
  float vnoise(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y); }
  void main(){
    vec4 tex=texture2D(uTex,clamp(vUv,0.0015,0.9985));
    float t=clamp(vZ,-1.0,1.0);

    // swept as an angle rather than a slope so the normal can reach the joints
    float ang=1.15*sign(t)*pow(abs(t),1.25);

    vec2 q=vUv*vec2(11.0,78.0)+uSeed;
    float tooth=vnoise(q)*0.6+vnoise(q*2.7)*0.4;
    vec3 N=normalize(vNw*cos(ang) + vTw*sin(ang)

    vec3 V=normalize(vWV);

    vec3 L=normalize(vec3(0.52,0.70,0.55));
    vec3 F=normalize(vec3(-0.35,-0.18,0.92));
    float shade=0.70+0.34*max(dot(N,L),0.0)+0.14*max(dot(N,F),0.0);
    shade*=1.0-0.16*smoothstep(0.78,1.0,abs(t));      // the joint grooves
    vec3 col=tex.rgb*shade;

    // the key sits off to the right, so on the back it only ever grazes the
    // front joint — the bounce off the paper wall is what rakes the round

    float nh=max(dot(N,Hv),0.0), nf=max(dot(N,Hf),0.0);
    col+=vec3(pow(nh,110.0)*0.55*uSatin);
    col+=vec3(pow(nh,14.0)*0.045*uSatin);
    col+=vec3(pow(nf,46.0)*0.150*uSatin);
    col+=vec3(pow(nf,9.0)*0.032*uSatin);
    col+=vec3(pow(1.0-max(dot(N,V),0.0),3.4)*0.055*uSatin);
    col+=vec3((tooth-0.5)*0.010*uSatin);

    #include <colorspace_fragment>
  }`;
function spineMaterial(tex,seed){
  return new THREE.ShaderMaterial({transparent:true,
    uniforms:{uTex:{value:tex},uOpacity:{value:0},uSeed:{value:seed},

        // paper carries no real specular, only a graze
        col+=uCol*pow(1.0-max(dot(N,V),0.0),3.2)*max(dot(N,L),0.0)*0.11;
        gl_FragColor=vec4(min(col,vec3(1.0)),uOpacity);
        #include <colorspace_fragment>
      }`});
}

/* ---- tweens ---- */
const easeOutQuart=t=>1-Math.pow(1-t,4);
const easeSettle  =t=>t<0.5? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const activeEase  =t=>t<0.3? 0.3*Math.pow(t/0.3,3) : 0.3+0.7*(1-Math.pow(1-(t-0.3)/0.7,3));
let NOW=0;
class Tw{
  constructor(v){this.v=v.slice();this.from=v.slice();this.to=v.slice();this.t0=0;this.d=0;this.e=easeOutQuart;}
  start(to,d,e,delay){this.from=this.v.slice();this.to=to.slice();this.t0=NOW+(delay||0);this.d=Math.max(d,1);this.e=e||easeOutQuart;}
  set(to){this.v=to.slice();this.from=to.slice();this.to=to.slice();this.d=0;}
  update(){ if(this.d<=0)return;
    let t=(NOW-this.t0)/this.d; if(t<0)return; if(t>=1){t=1;this.d=0;}
    const k=this.e(t); for(let i=0;i<this.v.length;i++)this.v[i]=this.from[i]+(this.to[i]-this.from[i])*k; }
}
class Spring{
  constructor(v,tension,friction,mass){this.v=v.slice();this.tgt=v.slice();this.vel=v.map(()=>0);
    this.k=tension;this.c=friction;this.m=mass||1;}
  start(t){this.tgt=t.slice();}
  update(dt){dt=Math.min(dt,1/30);
    for(let i=0;i<this.v.length;i++){
      const a=(this.k*(this.tgt[i]-this.v[i])-this.c*this.vel[i])/this.m;
      this.vel[i]+=a*dt;this.v[i]+=this.vel[i]*dt;}}
}

const mPos=(i,scroll)=>{
  const k=i-(scroll||0);
  if(k>=0) return [0, K.mY + k*K.mStepY, K.mZ0 - k*K.mStepZ];
  return [0, K.mY + k*0.86, K.mZ0 - k*0.14];
};
const slotX=i=>(i-2)*K.slot;
function bookBase(b){
  if(MOBILE) return mPos(b.index,0);
  return [slotX(b.data.slot), K.shelfTop[b.data.shelf]+(SZH/2)*Math.cos(b._lean), K.bookZ];

      uniform sampler2D uTex; uniform float uOpacity; varying vec2 vUv;
      float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(0.1031,0.1030,0.0973));
        p3+=dot(p3,p3.yxz+33.33);return fract((p3.x+p3.y)*p3.z);}

  B.tHover.start([B.base[0],B.base[1]+0.06,B.base[2]],K.activeDuration,easeOutQuart);
  B.tActiveP.start([...B.basePos],K.activeDuration,activeEase);

  vertexShader:`varying vec2 vUv; void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,

    uniform float noiseScale; uniform float intensity; uniform bool ignoreBlur;
    uniform float samples; uniform vec2 resolution;

const detailEl=document.getElementById('detail');

function hash1(i){ let x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function vnoise1(t,seed){
  const i=Math.floor(t), f=t-i, u=f*f*(3-2*f);
  return lerp(hash1(i+seed*97.3), hash1(i+1+seed*97.3), u);
}
function hash2(x,y){ let v=Math.sin(x*12.9898+y*78.233)*43758.5453; return v-Math.floor(v); }

/* the torn band: solid on the left, breaking into fibres on the right */
function buildTearBand(TW,h){
  const oct=[[1/430,44],[1/170,21],[1/74,10.5],[1/31,5.0],[1/13,2.4],[1/6,1.2]];
  const edge=new Float32Array(h);
  for(let y=0;y<h;y++){
    let e=TW*0.42;
    for(let k=0;k<oct.length;k++) e+=(vnoise1(y*oct[k][0],k+1)-0.5)*2*oct[k][1];
    edge[y]=e;
  }
  const a=new Float32Array(TW*h);
  for(let y=0;y<h;y++){
    const e=edge[y];
    const fib=5+17*vnoise1(y/8.5,11);          // fibre length varies down the tear
    for(let x=0;x<TW;x++){
      const t=(x-e)/fib;
      let v;
      if(t<=0) v=1;
      else if(t>=1.35) v=0;
      else {
        // break the falloff up so it reads as fibres rather than a soft cut
        const n=hash2(Math.floor(x*0.9),Math.floor(y*0.75))*0.62
               +hash2(Math.floor(x*2.4)+37,Math.floor(y*2.1)+11)*0.38;
        v=clamp(1.18-t-(n-0.5)*0.95,0,1);
        v=v*v*(3-2*v);
      }
      a[y*TW+x]=v;
    }
  }
  return a;
}
function tintBand(a,TW,h,r,g0,b0,edgeDark){
  const c=C(TW,h), g=c.getContext('2d');
  const img=g.createImageData(TW,h), d=img.data;
  for(let i=0;i<TW*h;i++){
    const v=a[i];
    let k=1;
    if(edgeDark&&v>0.02&&v<0.97) k=0.86+0.14*v;   // compressed fibres at the tear
    d[i*4]=r*k; d[i*4+1]=g0*k; d[i*4+2]=b0*k;
    d[i*4+3]=v*255;
  }
  g.putImageData(img,0,0);
  return c;
}
function buildSheet(){
  const w=WASH.w,h=WASH.h;
  if(w<8||h<8) return;
  const TW=Math.min(210,Math.round(w*0.34));
  const X0=Math.max(0,w-TW-46);
  const a=buildTearBand(TW,h);
  const paper=tintBand(a,TW,h,219,202,175,true);
  const dark =tintBand(a,TW,h,86,68,46,false);
  const cv=C(w,h), g=cv.getContext('2d');
  // the sheet casts a soft shadow onto the scene behind it
  const BL=40;                       // the sheet bleeds past the left edge of the canvas
  g.save(); g.globalAlpha=0.34; g.filter=`blur(${Math.round(h*0.020)}px)`;
  g.fillStyle='#56432e'; g.fillRect(-BL,0,X0+16+BL,h);
  g.drawImage(dark,X0+16,0);
  g.restore();
  // the sheet itself
  const pg=g.createLinearGradient(0,0,w,0);
  pg.addColorStop(0,'rgb(222,206,180)');
  pg.addColorStop(0.72,'rgb(219,202,175)');
  pg.addColorStop(1,'rgb(213,195,167)');
  g.fillStyle=pg; g.fillRect(-BL,0,X0+1+BL,h);
  g.drawImage(paper,X0,0);
  // fibre grain, only where there is paper
  g.globalCompositeOperation='source-atop';
  const r=mulberry(913);
  for(let i=0;i<2600;i++){
    const x=r()*w, y=r()*h, l=2+r()*26, ang=(r()-0.5)*0.5;
    g.strokeStyle=r()<0.5?`rgba(255,250,240,${0.02+r()*0.05})`:`rgba(120,98,70,${0.02+r()*0.05})`;
    g.lineWidth=r()<0.85?1:2;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(ang)*l,y+Math.sin(ang)*l); g.stroke();
  }
  g.fillStyle='rgba(255,252,244,0.05)';
  g.fillRect(-BL,0,w+BL,h*0.5);
  g.globalCompositeOperation='source-over';
  WASH.sheet=cv; WASH.travel=X0+TW+60;
}
function washResize(){
  const w=Math.max(1,washEl.clientWidth), h=Math.max(1,washEl.clientHeight);
  washEl.width=w; washEl.height=h; WASH.w=w; WASH.h=h;
  buildSheet(); WASH.dirty=true;
}
function drawWash(){
  const w=WASH.w,h=WASH.h,t=WASH.t;
  wctx.clearRect(0,0,w,h);
  if(t<=0.002||!WASH.sheet) return;
  wctx.drawImage(WASH.sheet,-(1-t)*WASH.travel,0);
}

const mbar=document.getElementById('mbar'), mMeta=document.getElementById('mbar-meta'),
      mTitle=document.getElementById('mbar-title'), mDetails=document.getElementById('mbar-details'),
      mLook=document.getElementById('mbar-look'), menuBtn=document.getElementById('menubtn'),
      menu=document.getElementById('menu');
const M={scroll:0,target:0,index:0,dragging:false,lastY:0};

function showDetail(B){
  const d = B.data;
  if (dTitle) dTitle.textContent = d.title;
  if (dDesc) dDesc.textContent = d.about || d.blurb || '';

  const dGithub = document.getElementById('detail-github');
  const dLive = document.getElementById('detail-live');

    if (d.github) {

  if (dLive) {

    } else {

  detailEl.classList.add('on');

  if (MOBILE) {

  try {

if (dClose) dClose.addEventListener('click',e=>{e.stopPropagation();clearActive();});
if (dLook) dLook.addEventListener('click',e=>{e.stopPropagation();flipActive();});

const tl=document.getElementById('tl');
if (tl) {
  BOOKS.forEach((d,i)=>{

                `<p class="studio">Volume ${d.vol}</p><h2>${d.title}</h2></span>`;
    b.addEventListener('pointerenter',()=>{ if(S.anim==='inactive'&&!MOBILE)setLifted(books[i]); });
    b.addEventListener('pointerleave',()=>{ if(S.anim==='inactive'&&!MOBILE)setLifted(null); });

const btnCert = document.getElementById('btn-certificates');
if (btnCert) {
  btnCert.addEventListener('click', (e) => {

      window.parent.postMessage({ type: 'ASHEN_NAVIGATE', page: 'certificates' }, '*');

BOOKS.forEach((d,i)=>{
  const b=document.createElement('button');
  b.innerHTML=`<span>${d.year} · Volume ${d.vol}</span>${d.title}`;
  b.addEventListener('click',()=>{menu.hidden=true;M.target=i;if(S.active)clearActive();});
  menu.appendChild(b);
});
menuBtn.addEventListener('click',()=>{menu.hidden=!menu.hidden;});

function setLifted(B){
  if(S.lifted===B)return;
  if(S.lifted&&S.lifted!==S.active)hoverOut(S.lifted);
  S.lifted=B;
  if(B)hoverIn(B);
}
function setMobileIndex(i,force){
  i=clamp(i,0,BOOKS.length-1);
  if(!force&&i===M.index)return;
  M.index=i; const d=BOOKS[i];
  mMeta.textContent=`${STUDIO} · ${d.year}`; mTitle.textContent=d.title;
}
let snapTimer=null;
function mobileSnap(delay){clearTimeout(snapTimer);
  snapTimer=setTimeout(()=>{M.target=clamp(Math.round(M.target),0,BOOKS.length-1);},delay);}
function mobileScrollBy(dv){M.target=clamp(M.target+dv,0,BOOKS.length-1);mobileSnap(170);}
addEventListener('wheel',e=>{ if(!MOBILE||S.active)return; mobileScrollBy(e.deltaY/420); },{passive:true});
canvas.addEventListener('touchstart',e=>{ if(!MOBILE)return; M.dragging=true; M.lastY=e.touches[0].clientY; },{passive:true});
canvas.addEventListener('touchmove',e=>{
  if(!MOBILE||!M.dragging||S.active)return;
  const y=e.touches[0].clientY; mobileScrollBy((M.lastY-y)/190); M.lastY=y; },{passive:true});
addEventListener('touchend',()=>{M.dragging=false;if(MOBILE&&!S.active)mobileSnap(60);},{passive:true});
if (mDetails) mDetails.addEventListener('click',e=>{e.stopPropagation();if(S.active)clearActive();else setActive(books[M.index]);});
if (mLook) mLook.addEventListener('click',e=>{e.stopPropagation();lookInside(books[M.index]);});

/* ---- pointer ---- */
const ray=new THREE.Raycaster();
ray.layers.enable(LAY_BG); ray.layers.enable(LAY_FG);
const ptr=new THREE.Vector2();
const DRAG={on:false,moved:0,lx:0,ly:0,rx:0,ry:0};
function dragReset(){DRAG.on=false;DRAG.moved=0;DRAG.rx=0;DRAG.ry=0;}
addEventListener('pointermove',e=>{
  ORB.tx=(e.clientX/VW-0.5)*2; ORB.ty=(e.clientY/VH-0.5)*2;
  hintEl.style.transform=`translate(${e.clientX+12}px,${e.clientY+12}px)`;
  if(S.anim==='intro'||MOBILE)return;
  ptr.x=(e.clientX/VW)*2-1; ptr.y=-(e.clientY/VH)*2+1;
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(books.map(b=>b.hit),false);
  const B=hits.length?hits[0].object.userData.book:null;
  if(S.active){
    if(DRAG.on){                                   // turning the volume in the hand
      const dx=e.clientX-DRAG.lx, dy=e.clientY-DRAG.ly;
      DRAG.lx=e.clientX; DRAG.ly=e.clientY;
      DRAG.moved+=Math.abs(dx)+Math.abs(dy);
      DRAG.ry+=dx*0.0090;
      DRAG.rx=clamp(DRAG.rx+dy*0.0062,-0.62,0.62);
      S.active.sWob.start([DRAG.rx,DRAG.ry,0]);
      document.body.style.cursor='grabbing';
      return;
    }
    if(B===S.active&&S.anim==='active'){
      if(!REDUCED&&hits[0].uv){                    // a light parallax when the hand is off
        const uv=hits[0].uv;
        S.active.sWob.start([DRAG.rx+Math.PI/46*(uv.y-.5)*2*(S.active.flipped?-1:1),
                             DRAG.ry+Math.PI/36*((S.active.flipped?1-uv.x:uv.x)-.5)*2,0]);
      }
      hintEl.classList.add('on'); document.body.style.cursor='grab';
    } else { hintEl.classList.remove('on'); document.body.style.cursor='default';
             S.active.sWob.start([DRAG.rx,DRAG.ry,0]); }
    return;
  }
  if(S.anim!=='inactive')return;
  setLifted(B);
  document.body.style.cursor=B?'pointer':'default';
  if(B&&hits[0].uv&&!REDUCED){
    const uv=hits[0].uv;
    B.sWob.start([Math.PI/50*(uv.y-.5)*2, Math.PI/40*(uv.x-.5)*2, 0]);
  }
});
addEventListener('pointerleave',()=>{ ORB.tx=0;ORB.ty=0;
  if(!MOBILE&&!S.active&&S.anim==='inactive')setLifted(null); });
addEventListener('blur',()=>{ ORB.tx=0;ORB.ty=0; });
addEventListener('pointerdown',e=>{
  if(e.target.closest('header')||e.target.closest('footer')||
     e.target.closest('.detail')||e.target.closest('.mbar')||e.target.closest('.menu'))return;
  ptr.x=(e.clientX/VW)*2-1; ptr.y=-(e.clientY/VH)*2+1;
  ray.setFromCamera(ptr,camera);
  if(S.active){
    const h=ray.intersectObject(S.active.body,false);
    if(h.length){
      DRAG.on=true; DRAG.moved=0; DRAG.lx=e.clientX; DRAG.ly=e.clientY;
      document.body.style.cursor='grabbing';
      try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    } else clearActive();
    return;
  }
  const hits=ray.intersectObjects(books.map(b=>b.hit),false);
  if(hits.length) setActive(MOBILE?books[M.index]:hits[0].object.userData.book);
});
addEventListener('pointerup',e=>{
  if(!DRAG.on)return;
  DRAG.on=false;
  try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
  document.body.style.cursor='grab';
  if(DRAG.moved<10) flipActive();               // a tap still turns the volume over
});
addEventListener('pointercancel',()=>{ DRAG.on=false; });
addEventListener('keydown',e=>{
  if(e.key==='Escape'&&S.active)clearActive();
  if((e.key===' '||e.code==='Space')&&S.active){e.preventDefault();flipActive();}
});

/* ════════════════════════════════════════════════════════════════════════
   7 · MODE, INTRO, RENDER LOOP
   ════════════════════════════════════════════════════════════════════════ */
function applyMode(){
  document.body.classList.toggle('mobile',MOBILE);
  furniture.visible=!MOBILE;
  wall.visible=true;
  for(const B of books){
    B.basePos=bookBase(B);
    B.restTilt=MOBILE?K.mTilt:B._lean;
    if(B!==S.active){
      B.tActiveP.set([...B.basePos]);
      B.tTilt.set(MOBILE?[K.mTilt,0,0]:[...B.rest]);
      B.tHover.set([...B.base]);
    }
    B.hit.position.set(B.basePos[0],B.basePos[1],B.basePos[2]-0.04);
    B.hit.rotation.x=MOBILE?K.mTilt:B._lean; B.hit.rotation.y=MOBILE?0:B._yaw;
    B.wallSh.visible=!MOBILE; B.cs.visible=!MOBILE; B.crease.visible=!MOBILE; B.refl.visible=!MOBILE;
    B.gRoot.renderOrder=MOBILE?100-B.index:0;
  }
  if(MOBILE)setMobileIndex(M.index,true);
  frameCamera();
}
MOBILE_Q.addEventListener('change',e=>{MOBILE=e.matches;applyMode();});

const wallFade=new Tw([0]);
function revealChrome(){
  const step=REDUCED?0:1;
  for(const el of document.querySelectorAll('.rise')){
    el.style.setProperty('--d',(+el.dataset.d||0)*step+'ms');
  }
  // one reflow so the delays are in place before the class that plays them
  void document.body.offsetHeight;
  for(const el of document.querySelectorAll('.rise')) el.classList.add('in');
}
function startIntro(){
  // the volumes are already shelved — they only fade up, no tipping or settling
  S.anim='intro';
  wallFade.start([1],K.introWallFade,easeOutQuart);
  books.forEach((B,i)=>{
    B.tScale.set([1]);
    B.tHover.set([...B.base]);
    B.tTilt.set(MOBILE?[B.restTilt,0,0]:[...B.rest]);
    B.tFade.set([0]);
    B.tFade.start([1],K.introFade,easeOutQuart,i*K.introStagger);
  });
  setTimeout(()=>{ if(S.anim==='intro')S.anim='inactive'; },
             K.introWallFade+books.length*K.introStagger);
}


let last=performance.now();
function tick(now){
  requestAnimationFrame(tick);
  NOW=now; const dt=Math.min((now-last)/1000,0.05); last=now;

  // during the intro the camera snaps to the pointer instead of easing, so the
  // shelf never swings into place on load
  {
    const tg=WASH.target, k2=Math.min(1,dt*(tg>WASH.t?5.2:8.5));
    if(Math.abs(tg-WASH.t)>0.0009||WASH.dirty){ WASH.t+=(tg-WASH.t)*k2; WASH.dirty=false; drawWash(); }
  }
  const k=(S.anim==='intro')?1:Math.min(1,dt*3.4);
  ORB.x+=(ORB.tx-ORB.x)*k; ORB.y+=(ORB.ty-ORB.y)*k;
  applyCamera();

  wallFade.update();
  const wf=wallFade.v[0];
  wallMat.uniforms.uOpacity.value=wf; oakH.uniforms.uOpacity.value=wf; oakV.uniforms.uOpacity.value=wf;

  if(MOBILE){
    if(!S.active) M.scroll+=(M.target-M.scroll)*Math.min(1,dt*9);
    setMobileIndex(Math.round(M.scroll));
    for(const B of books){
      B.basePos=mPos(B.index,M.scroll);
      if(B===S.active||S.anim==='animatingBackward')continue;
      B.tActiveP.v[0]=B.basePos[0];B.tActiveP.v[1]=B.basePos[1];B.tActiveP.v[2]=B.basePos[2];
      B.tActiveP.d=0;
      const u=clamp(M.scroll-B.index,0,1.6);
      B.tTilt.v[0]=lerp(K.mTilt,K.mFlat,smooth(Math.min(u,1))); B.tTilt.d=0;
      B.mFade=1-smooth(clamp((u-0.28)/0.5,0,1));
      B.gRoot.visible=B.mFade>0.01 && B.index-M.scroll<9.5;
    }
  }

  for(const B of books){
    B.tHover.update();B.tTilt.update();B.tActiveP.update();B.tActiveR.update();
    B.tScale.update();B.tRefl.update();B.tFade.update();B.tSeat.update();B.sWob.update(dt);
    B.gHover.position.set(B.tHover.v[0],B.tHover.v[1],B.tHover.v[2]);
    B.gTilt.rotation.set(B.tTilt.v[0],B.tTilt.v[1],B.tTilt.v[2]);
    B.gWob.rotation.set(B.sWob.v[0],B.sWob.v[1],B.sWob.v[2]);
    B.gRoot.position.set(B.tActiveP.v[0],B.tActiveP.v[1],B.tActiveP.v[2]);
    B.gRoot.rotation.set(B.tActiveR.v[0],B.tActiveR.v[1],B.tActiveR.v[2]);
    B.gScl.scale.setScalar(B.tScale.v[0]);
    const op=B.tFade.v[0]*wf*(MOBILE&&B.mFade!==undefined&&B!==S.active?B.mFade:1);
    B.clothMat.opacity=op; B.spineMat.uniforms.uOpacity.value=op;
    B.pages.uniforms.uOpacity.value=op;
    B.coverMat.uniforms.uOpacity.value=op;
    B.backMat.uniforms.uOpacity.value=op;
    if(!MOBILE){
      const lift=B.tHover.v[1], away=clamp((B.tHover.v[2]-B.base[2])/0.075,0,1);
      B.wallSh.position.x=B.basePos[0]-0.09-away*0.05;
      B.wallSh.position.y=B.basePos[1]+lift-0.04+away*0.02;
      B.wallSh.scale.setScalar((1+away*0.13)*(B.tScale.v[0]||0.0001));
      const seat=B.tSeat.v[0];                                   // 1 on the shelf, 0 in the hand
      B.wallSh.material.opacity=(0.50-away*0.15)*op*seat;
      B.cs.material.opacity=(0.92*(1-away*0.55))*op*seat;
      B.crease.material.opacity=(0.55*(1-away))*op*seat;
      B.reflMat.uniforms.uOpacity.value=B.tRefl.v[0]*op*seat;
      B.refl.position.z=K.bookZ+(SZH/2)*Math.sin(-B._lean)+0.24+B.tHover.v[2]*2;
    }
  }

  const wantBlur=(S.anim==='animatingForward'||S.anim==='active');
  if(blurTw._w!==wantBlur){blurTw._w=wantBlur;
    blurTw.i.start([wantBlur?16:0],460,t=>t,100);
    blurTw.n.start([wantBlur?6:1],400,t=>t,100);}
  blurTw.i.update();blurTw.n.update();

  const act=(S.anim==='animatingForward'||S.anim==='active'||S.anim==='animatingBackward');
  camera.layers.set(LAY_BG);
  renderer.setRenderTarget(rt);
  renderer.clear(true,true,false);
  renderer.render(scene,camera);
  renderer.setRenderTarget(null);
  passMat.uniforms.ignoreBlur.value=!act;
  passMat.uniforms.intensity.value=blurTw.i.v[0];
  passMat.uniforms.noiseScale.value=blurTw.n.v[0];
  renderer.clear(true,true,false);
  renderer.render(quadScene,quadCam);
  if(act){
    renderer.clearDepth();
    camera.layers.set(LAY_FG);
    renderer.render(scene,camera);
  }
}

/* ---- boot ---- */
const loader=document.getElementById('loader'), barfill=document.getElementById('barfill');
const setProgress=p=>barfill.style.transform=`scaleX(${p})`;
setProgress(0.06);
const frame=()=>new Promise(r=>{let done=false;const go=()=>{if(!done){done=true;r();}};
  requestAnimationFrame(go);setTimeout(go,34);});

(async function boot(){
  try {
    try{ await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2200))]); }catch(e){}
    setProgress(0.10);
    await loadPlates();
    setProgress(0.16);
    if(!document.hidden) await frame();
    for(let i=0;i<BOOKS.length;i++){
      books.push(buildBook(BOOKS[i],i));
      setProgress(0.16+0.80*(i+1)/BOOKS.length);
      if(!document.hidden) await frame();
    }
    applyMode();
    resize(); washResize();
    setProgress(1);
    requestAnimationFrame(tick);
    await frame(); await frame();
  } catch(err) {
    console.error('BOOT ERROR:', err);
  } finally {
    if (loader) loader.classList.add('gone');
    if (canvas) canvas.classList.add('on');
    revealChrome();
    const footerEl = document.querySelector('footer');
    if (footerEl) footerEl.classList.add('on');
    if (mbar) mbar.classList.add('on');
    window.__setActive = (idx) => setActive(books[idx]);
    startIntro();
  }
})();
</script>
